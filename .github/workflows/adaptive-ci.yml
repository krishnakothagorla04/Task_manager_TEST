# Adaptive CI/CD - routes each commit to a fast / standard / extended lane based
# on predicted risk. Low-risk changes skip the expensive Docker build + scan,
# saving pipeline time; risky changes get the full validation.
# (Runs alongside deploy.yml. For a clean demo, temporarily disable deploy.yml.)
name: Adaptive CI

on:
  push:
    paths-ignore: ['logs/**']
  pull_request:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: adaptive-ci-log
  cancel-in-progress: false

jobs:
  predict-risk:
    name: Predict risk
    runs-on: ubuntu-latest
    outputs:
      lane: ${{ steps.risk.outputs.lane }}
      risk: ${{ steps.risk.outputs.risk }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install numpy || true
      - id: risk
        run: python predict.py
      - uses: actions/upload-artifact@v4
        with:
          name: prediction
          path: |
            prediction.json
            risk_summary.md
      - name: Comment risk on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');const body=fs.readFileSync('risk_summary.md','utf8');
            github.rest.issues.createComment({issue_number:context.issue.number,
              owner:context.repo.owner,repo:context.repo.repo,body});

  # LOW -> fast lane: install + tests only (skips Docker build/scan -> big time saving)
  fast-lane:
    name: Fast lane (low risk)
    needs: predict-risk
    if: needs.predict-risk.outputs.lane == 'LOW'
    runs-on: ubuntu-latest
    strategy:
      matrix: { service: [user-service, task-service] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '18' }
      - name: Install + test (timed)
        working-directory: ./${{ matrix.service }}
        run: |
          START=$(date +%s)
          npm install
          npm test
          echo "## Fast lane (${{ matrix.service }}) finished in $(( $(date +%s)-START ))s - skipped Docker build, scan and deploy" >> $GITHUB_STEP_SUMMARY

  # MED -> standard lane: install + test + dependency audit
  standard-lane:
    name: Standard lane (medium risk)
    needs: predict-risk
    if: needs.predict-risk.outputs.lane == 'MED'
    runs-on: ubuntu-latest
    strategy:
      matrix: { service: [user-service, task-service] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '18' }
      - name: Install + test + audit (timed)
        working-directory: ./${{ matrix.service }}
        run: |
          START=$(date +%s)
          npm install
          npm test
          npm audit --audit-level=high || true
          echo "## Standard lane (${{ matrix.service }}) finished in $(( $(date +%s)-START ))s - skipped Docker build/scan" >> $GITHUB_STEP_SUMMARY

  # HIGH -> extended lane: tests + blocking audit + Docker build + Trivy scan + gate
  extended-lane:
    name: Extended lane (high risk)
    needs: predict-risk
    if: needs.predict-risk.outputs.lane == 'HIGH'
    runs-on: ubuntu-latest
    environment: production   # add required reviewers in Settings for the approval gate
    strategy:
      matrix: { service: [user-service, task-service] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '18' }
      - name: Install + test
        working-directory: ./${{ matrix.service }}
        run: npm install && npm test
      - name: Dependency audit (blocking)
        working-directory: ./${{ matrix.service }}
        run: npm audit --audit-level=high
      - name: Build Docker image
        run: docker build -t ${{ matrix.service }}:ci ./${{ matrix.service }}
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ matrix.service }}:ci
          severity: HIGH,CRITICAL
          exit-code: '0'

  log-outcome:
    name: Log outcome
    needs: [predict-risk, fast-lane, standard-lane, extended-lane]
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - uses: actions/download-artifact@v4
        with: { name: prediction }
      - name: Log
        env:
          OUTCOME: ${{ (needs.fast-lane.result=='failure'||needs.standard-lane.result=='failure'||needs.extended-lane.result=='failure') && 'failed' || 'passed' }}
        run: python log_outcome.py
      - name: Commit outcome log
        run: |
          git config user.name "adaptive-ci-bot"; git config user.email "actions@github.com"
          git add logs/outcomes.csv
          git commit -m "chore: log CI outcome [skip ci]" || { echo "nothing"; exit 0; }
          for i in 1 2 3; do
            git pull --rebase --autostash origin ${{ github.ref_name }} && git push && exit 0
            sleep 3; done
          exit 1
